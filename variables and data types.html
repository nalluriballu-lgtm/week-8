<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>variables and  data</title>
</head>
<body>
    <h2>JavaScript Variables and Data Types</h2>     
    <div id="out"></div>       
    <script>         
        let name = "Arjun";              
        const age = 22;                   
        let isStudent = true;        
        let marks;                     
        let address = null;              
        let result = "";         
        result += "name = " + name + " (" + typeof name + ")<br>";         
        result += "age = " + age + " (" + typeof age + ")<br>";         
        result += "isStudent = " + isStudent + " (" + typeof isStudent + ")<br>";         
        result += "marks = " + marks + " (" + typeof marks + ")<br>";         
        result += "address = " + address + " (" + typeof address + ")<br>";           
        document.getElementById("out").innerHTML = result;     
    </script> 
</body>
</html>
